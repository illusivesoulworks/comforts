import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'com.modrinth.minotaur' version '2.+'
    id 'net.darkhax.curseforgegradle' version '1.+'
}

repositories {
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation "com.illusivesoulworks.spectrelib:spectrelib-fabric:${spectrelib_version}"
    include "com.illusivesoulworks.spectrelib:spectrelib-fabric:${spectrelib_version}"

    implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${cca_version}"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${cca_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-base:${cca_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-entity:${cca_version}"
}

sourceSets {
    main {
        resources {
            srcDirs += '../licenses'
        }
    }
}

fabricApi {
    configureDataGeneration()
}

loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("runs/server")
        }
    }
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = "${System.getenv('CURSEFORGE_KEY')}"
    def projectId = "${cf_id}".toString()
    def mainFile = upload(projectId, file("${project.layout.buildDirectory.get()}/libs/${base.archivesName.get()}-${version}.jar"))
    mainFile.changelogType = 'markdown'
    mainFile.changelog = file('../CHANGELOG_LATEST.md')
    mainFile.releaseType = "${release_type}"
    "${release_versions}".split(',').each {
        mainFile.addGameVersion("${it}")
    }
    mainFile.addRequirement("fabric-api")
    mainFile.withAdditionalFile(sourcesJar)

    doLast {

        if (project.hasProperty('cf_page') && mainFile.curseFileId != null) {
            project.ext.curse_link = "${cf_page}/files/${mainFile.curseFileId}"
        }
    }
}

modrinth {
    token = "${System.getenv('MODRINTH_KEY')}" ?: ""
    projectId = "${modrinth_id}"
    versionName = "${base.archivesName.get()}-${version}"
    versionType = "${release_type}"
    changelog = file('../CHANGELOG_LATEST.md').text
    uploadFile = file("${project.layout.buildDirectory.get()}/libs/${base.archivesName.get()}-${version}.jar")
    additionalFiles = [sourcesJar]
    gameVersions = "${release_versions}".split(",") as List<String>
    dependencies {
        required.project "fabric-api"
    }
}

tasks.modrinth.doLast {

    if (project.hasProperty('modrinth_page') && tasks.modrinth.newVersion != null) {
        project.ext.modrinth_link = "${modrinth_page}/version/${tasks.modrinth.newVersion.id}"
    }
}

// spectrelib 0.21.0+26.1.2 declares "minecraft": "~26.1" in its fabric.mod.json, which causes
// Fabric Loader to silently skip loading it on MC 26.2. Patch the bundled JiJ copy to use
// ">=26.1" so it loads on any 26.x build.
tasks.named('jar') {
    doLast {
        def jarFile = archiveFile.get().asFile
        def spectrelibEntryName = "META-INF/jars/spectrelib-fabric-${spectrelib_version}.jar"
        def outerUri = new URI("jar:" + jarFile.toURI().toString())
        def outerFs = java.nio.file.FileSystems.newFileSystem(outerUri, Collections.emptyMap())
        try {
            def spectrelibPath = outerFs.getPath(spectrelibEntryName)
            if (!java.nio.file.Files.exists(spectrelibPath)) {
                logger.warn("Could not find ${spectrelibEntryName} in output JAR to patch")
                return
            }
            def spectrelibBytes = java.nio.file.Files.readAllBytes(spectrelibPath)
            def baos = new java.io.ByteArrayOutputStream()
            def zos = new java.util.zip.ZipOutputStream(baos)
            def zis = new java.util.zip.ZipInputStream(new java.io.ByteArrayInputStream(spectrelibBytes))
            def zipEntry
            while ((zipEntry = zis.getNextEntry()) != null) {
                zos.putNextEntry(new java.util.zip.ZipEntry(zipEntry.name))
                if (zipEntry.name == "fabric.mod.json") {
                    def content = new String(zis.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
                    def patched = content.replace('"~26.1"', '">=26.1"')
                    zos.write(patched.getBytes(java.nio.charset.StandardCharsets.UTF_8))
                    if (patched != content) {
                        logger.lifecycle("Patched spectrelib JiJ: minecraft ~26.1 -> >=26.1")
                    }
                } else {
                    zos.write(zis.readAllBytes())
                }
                zos.closeEntry()
            }
            zis.close()
            zos.close()
            java.nio.file.Files.write(spectrelibPath, baos.toByteArray())
        } finally {
            outerFs.close()
        }
    }
}
